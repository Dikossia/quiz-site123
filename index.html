<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B21AD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тест">
<link rel="manifest" href="manifest.json">
<title>Тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2f1991;
    --primary-dark:#2f1991;
    --card:#F3F5F8;
    --text:#14161C;
    --muted:#9AA0AB;
    --border:#1E2128;
    --ok:#1DB954;
    --bad:#E5484D;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{background-color:#FFFFFF}
  /* фикс iOS: в режиме «на экране Домой» снизу оставалась пустая полоса */
  html,body{min-height:calc(100% + env(safe-area-inset-top))}
  @media all and (display-mode: standalone){
    html,body{height:100vh;min-height:calc(100vh + env(safe-area-inset-top))}
    .app{height:calc(100vh + env(safe-area-inset-top))}
  }
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    background-color:#FFFFFF;
    color:var(--text);
    overflow:hidden;
  }
  .app{
    max-width:480px;margin:0 auto;height:100dvh;
    display:flex;flex-direction:column;background:var(--primary);
    position:relative;
  }

  /* ---------- Header ---------- */
  .header{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;z-index:5;
    background:var(--primary);
    padding:calc(14px + env(safe-area-inset-top)) 18px 0;
    height:calc(82px + env(safe-area-inset-top));
    color:#fff;
  }
  .app{padding-top:calc(82px + env(safe-area-inset-top))}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .icon-btn{
    width:40px;height:40px;border:none;background:transparent;color:#fff;
    display:grid;place-items:center;cursor:pointer;border-radius:12px;
  }
  .icon-btn:active{background:rgba(255,255,255,.12)}
  .pill{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.16);
    color:#fff;border:none;border-radius:999px;
    padding:9px 18px;font:600 15px 'Poppins',sans-serif;cursor:pointer;
  }
  .pill:active{background:rgba(255,255,255,.24)}
  .pill svg{opacity:.95}
  .timer.warn{background:rgba(229,72,77,.85)}
  .progress{
    margin:20px 0 0;height:8px;border-radius:99px;
    background:rgba(255,255,255,.18);overflow:hidden;
  }
  .progress > div{
    height:100%;background:#fff;border-radius:99px;
    width:0;transition:width .35s ease;min-width:8px;
  }

  /* ---------- Card ---------- */
  .card{
    flex:1;margin-top:26px;background:var(--card);
    border-radius:28px 28px 0 0;
    display:flex;flex-direction:column;min-height:0;
  }
  .content{
    flex:1;overflow-y:auto;
    padding:4px 20px calc(110px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .q-label{
    font-size:13px;color:var(--muted);font-weight:500;
    padding-top:4px;
  }
  .q-text{
    font-size:21px;line-height:1.38;font-weight:700;
    margin:10px 0 26px;letter-spacing:-.1px;
  }
  .options{display:flex;flex-direction:column;gap:16px}
  .option{
    display:flex;align-items:center;gap:16px;
    width:100%;text-align:left;
    background:transparent;border:1.5px solid var(--border);
    border-radius:16px;padding:16px 18px;min-height:64px;
    font:400 16px/1.45 'Poppins',sans-serif;color:var(--text);
    cursor:pointer;transition:border-color .15s,background .15s;
  }
  .option .radio{
    flex:0 0 22px;height:22px;border-radius:50%;
    border:1.5px solid #6B7280;position:relative;transition:.15s;
  }
  .option.selected{border-color:var(--primary);background:#ECE9FF}
  .option.selected .radio{border-color:var(--primary)}
  .option.selected .radio::after{
    content:"";position:absolute;inset:4px;border-radius:50%;background:var(--primary);
  }
  .option:active{transform:scale(.995)}

  .fill-input{
    width:100%;border:1.5px solid var(--border);border-radius:16px;
    padding:18px;font:400 16px 'Poppins',sans-serif;color:var(--text);
    background:transparent;outline:none;
  }
  .fill-input:focus{border-color:var(--primary);background:#ECE9FF}

  /* ---------- Footer ---------- */
  .footer{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:100%;max-width:480px;z-index:5;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 20px max(14px, calc(env(safe-area-inset-bottom) - 8px));
    background:#FFFFFF;
    border-top:1px solid #E6E8EE;
    box-shadow:0 -4px 16px rgba(20,22,28,.05);
  }
  .btn{
    font:600 15px 'Poppins',sans-serif;border-radius:14px;
    padding:14px 28px;cursor:pointer;border:none;
  }
  .btn-outline{
    background:transparent;border:1.5px solid #C7CBD3;color:#B4B9C2;
  }
  .btn-outline:not(:disabled){border-color:var(--primary);color:var(--primary)}
  .btn-outline:not(:disabled):active{background:#ECE9FF}
  .btn-outline:disabled{cursor:default}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:active{background:var(--primary-dark)}

  /* ---------- Bottom sheet (grid) ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,10,30,.45);
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);
    width:100%;max-width:480px;background:#fff;
    border-radius:24px 24px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));
    transition:transform .28s ease;z-index:11;max-height:75dvh;overflow-y:auto;
  }
  .sheet.open{transform:translate(-50%,0)}
  .grabber{width:44px;height:5px;border-radius:9px;background:#D9DCE2;margin:0 auto 16px}
  .sheet h3{font-size:18px;font-weight:700;margin-bottom:6px}
  .sheet p{font-size:13px;color:var(--muted);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .grid button{
    aspect-ratio:1;border-radius:12px;border:1.5px solid #D9DCE2;background:#fff;
    font:600 15px 'Poppins',sans-serif;color:var(--text);cursor:pointer;
  }
  .grid button.answered{background:#ECE9FF;border-color:#C9C0FF;color:var(--primary)}
  .grid button.current{border-color:var(--primary);background:var(--primary);color:#fff}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
    width:calc(100% - 40px);max-width:400px;background:#fff;border-radius:22px;
    padding:24px 22px 20px;z-index:12;opacity:0;pointer-events:none;transition:.2s;
    text-align:center;
  }
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .modal h3{font-size:19px;margin-bottom:8px}
  .modal p{font-size:14px;color:#5B616E;margin-bottom:20px;line-height:1.5}
  .modal .row{display:flex;gap:10px}
  .modal .row .btn{flex:1;padding:13px 10px}

  /* ---------- Results ---------- */
  .result-head{text-align:center;padding:10px 0 24px}
  .score-ring{
    width:150px;height:150px;margin:6px auto 16px;border-radius:50%;
    display:grid;place-items:center;
  }
  .score-ring > div{
    width:122px;height:122px;border-radius:50%;background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .score-ring b{font-size:32px;line-height:1}
  .score-ring span{font-size:13px;color:var(--muted);margin-top:4px}
  .result-head h2{font-size:22px;margin-bottom:4px}
  .result-head p{font-size:14px;color:#5B616E}
  .stats{display:flex;gap:10px;margin-bottom:22px}
  .stat{flex:1;background:#fff;border-radius:16px;padding:12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:12px;color:var(--muted)}
  .review-item{
    background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;
    border-left:4px solid var(--bad);
  }
  .review-item.ok{border-left-color:var(--ok)}
  .review-item .n{font-size:12px;color:var(--muted);margin-bottom:4px}
  .review-item .qq{font-weight:600;font-size:15px;margin-bottom:8px;line-height:1.4}
  .review-item .a{font-size:13.5px;line-height:1.45;margin-top:3px}
  .review-item .a.your{color:var(--bad)}
  .review-item .a.right{color:var(--ok)}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header" id="header">
    <div class="top-row">
      <button class="icon-btn" id="closeBtn" aria-label="Закрыть">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="pill" id="gridBtn">
        <span id="counter">1 / 40</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <div class="pill timer" id="timerPill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
        <span id="timer">40:00</span>
      </div>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
  </header>

  <!-- Card -->
  <main class="card">
    <section class="content" id="content">
      <div id="quizView">
        <div class="q-label" id="qLabel">Вопрос 1 из 40</div>
        <h1 class="q-text" id="qText"></h1>
        <div class="options" id="options"></div>
      </div>
      <div id="resultView" class="hidden"></div>
    </section>

    <footer class="footer" id="footer">
      <button class="btn btn-outline" id="prevBtn" disabled>Назад</button>
      <button class="btn btn-primary" id="nextBtn">Далее</button>
    </footer>
  </main>
</div>

<!-- Grid sheet -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <h3>Все вопросы</h3>
  <p id="sheetInfo">Отвечено 0 из 40</p>
  <div class="grid" id="grid"></div>
</div>

<!-- Confirm modal -->
<div class="modal" id="modal">
  <h3 id="modalTitle">Завершить тест?</h3>
  <p id="modalText">Ответы будут проверены, изменить их уже не получится.</p>
  <div class="row">
    <button class="btn btn-outline" id="modalCancel" style="color:var(--text);border-color:var(--border)">Отмена</button>
    <button class="btn btn-primary" id="modalOk">Завершить</button>
  </div>
</div>

<script>
/* =========================================================
   ВОПРОСЫ — меняй/добавляй здесь.
   answer = индекс правильного варианта (0, 1, 2, 3)
   ========================================================= */
const TF = ["True","False"];
const QUESTIONS = [
  { q:"A building that houses an organization's servers, storage and networking equipment is called a ____.", hint:"2 слова", accept:["data center","data centre","datacenter"] },
  { q:"In distributed shared memory (DSM), multicore nodes, each with its own memory and I/O, are connected by an ____.", hint:"2 слова", accept:["interconnection network","interconnect network"] },
  { q:"In BigTable, column keys are grouped into sets called ____.", hint:"2 слова", accept:["column families","column family"] },
  { q:"In a directory-based protocol, the node where a memory block and its directory entry reside is called the ____.", hint:"2 слова", accept:["home node"] },
  { q:"Which statement best describes the difference between CPUs and GPUs?",
    options:["A CPU has thousands of simple cores built for throughput and optimized for fast serial work; a GPU has a few complex cores built for low latency","GPUs cannot perform floating-point arithmetic","A CPU has a few powerful cores optimized for fast serial work; a GPU has thousands of simpler cores optimized for massively parallel work","CPUs and GPUs have identical designs and differ only in price"], answer:2 },
  { q:"How are a program, a process and a thread related?",
    options:["A thread contains several processes, and a process contains several programs","A program is stored on disk; when it is instantiated in RAM it becomes a process, and a process contains one or more threads","A process is stored on disk and becomes a program when it is loaded into RAM","Program, process and thread are three names for the same thing"], answer:1 },
  { q:"Which part of the operating system selects which thread runs next on the CPU?",
    options:["The scheduler","The compiler","The linker","The cache controller"], answer:0 },
  { q:"In Flynn's taxonomy, multiprocessors and multicomputers belong to which class?",
    options:["SISD","SIMD","MIMD","MISD"], answer:2 },
  { q:"In the MSI snooping protocol, what are the three possible states of a cache block?",
    options:["Master, Slave, Idle","Modified, Shared, Invalid","Mapped, Stored, Indexed","Main, Secondary, Indirect"], answer:1 },
  { q:"In a directory-based cache coherence protocol, where is the sharing status of a block of physical memory kept?",
    options:["In every cache that holds a copy of the block","In the processor's registers","In just one location, the directory","On the disk"], answer:2 },
  { q:"Which statement best describes cloud computing?",
    options:["On-demand access to computing resources over the Internet, paid for as they are used","Buying servers and keeping them in your own office","A level of the CPU cache hierarchy where many servers run the project tasks according to number of active users","A method of cooling data centers"], answer:0 },
  { q:"In data centers, what does CRAC stand for?",
    options:["Central Rack Access Controller","Cooling Rack Air Channel","Cache Read After Clear","Computer Room Air Conditioning unit"], answer:3 },
  { q:"In the Google File System (GFS), which servers store the actual file data?",
    options:["The GFS master","Chunkservers","Routers","Main Server"], answer:1 },
  { q:"Compared with Dynamo's get/put API, what does BigTable's API offer?",
    options:["Only get","get, put, scan and delete","SQL SELECT statements only","push and pull"], answer:1 },
  { q:"Why did Facebook build a data center in Luleå, Sweden?",
    options:["Sweden has no electricity costs","The cold climate allows free cooling with outside air, and cheap renewable hydroelectric power is available","To be closer to its users in the United States","Sea water can be pumped directly through the servers and naturally cool them without paying for additional tools"], answer:1 },
  { q:"SIMD is more energy efficient than MIMD because it fetches only one instruction for many data operations.", options:TF, answer:0 },
  { q:"Adding more cores always increases performance without any increase in power consumption.", options:TF, answer:1 },
  { q:"Water is used to cool WSCs because it can carry away much more heat than the same volume of air.", options:TF, answer:0 },
  { q:"Bypassing, speculation and out-of-order execution together eliminate all delays caused by dependent instructions.", options:TF, answer:1 },
  { q:"In the MSI protocol, a block that is in the Modified state in one cache cannot be in the Shared state in another cache at the same time.", options:TF, answer:0 },
  { q:"What is a vector register?",
    options:["A register that stores only memory addresses","A register that stores multiple data elements","A register that controls the operating system","A register used only for instruction decoding"], answer:1 },
  { q:"What is vector stride?",
    options:["The distance between consecutive elements accessed in memory","The number of instructions executed per second","The total size of a vector register at the same time it's called VLR","The number of processors in a system"], answer:0 },
  { q:"What does AVX stand for?",
    options:["Advanced Vector Extensions","Automatic Virtual Execution","Advanced Variable Exchange","Accelerated Virtual Extensions"], answer:0 },
  { q:"Which type of processor is particularly suitable for graphics processing and highly parallel computations?",
    options:["GPU","Keyboard controller","Hard disk controller","Printer processor"], answer:0 },
  { q:"What does SIMT stand for in GPU architecture?",
    options:["Single Instruction, Multiple Threads","Sequential Instruction, Multiple Tasks","Shared Instruction, Memory Transfer","Single Input, Multiple Transactions"], answer:0 },
  { q:"Vector registers can store multiple data elements.", options:TF, answer:0 },
  { q:"Vector processing is useful for matrix-oriented scientific computing.", options:TF, answer:0 },
  { q:"GPUs are designed primarily for sequential execution of a small number of instructions.", options:TF, answer:1 },
  { q:"What is a thread in an operating system?",
    options:["A physical CPU component","An independent portion of a program that can run in parallel","A type of storage device","A computer network"], answer:1 },
  { q:"Which memory space do threads belonging to the same process share?",
    options:["Separate physical memory","Shared virtual memory space","Separate disk space","CPU cache only"], answer:1 },
  { q:"What is the main purpose of thread-level parallelism?",
    options:["To execute multiple threads concurrently","To increase disk capacity","To reduce the number of instructions in a program","To eliminate operating systems"], answer:0 },
  { q:"Which component selects threads for CPU execution?",
    options:["Compiler","Scheduler","Hard disk","Cache controller"], answer:1 },
  { q:"What is one important difference between processes and threads?",
    options:["Processes share one virtual memory space, while threads do not","Each process has its own virtual memory space, while threads of the same process share memory","Processes cannot execute instructions, while threads contains many processes to execute program","Threads always require separate computers"], answer:1 },
  { q:"Why can instructions from different threads be interleaved in a pipeline?",
    options:["To guarantee that all instructions use the same data with no dependencies between them","To reduce dependencies between consecutive instructions from different threads","To remove the need for a CPU scheduler","To prevent memory access"], answer:1 },
  { q:"In a snooping-based coherence protocol, what does each cache with a copy of data also maintain?",
    options:["A copy of the sharing status of the block","A complete copy of the operating system","A separate CPU scheduler","A copy of every processor's registers"], answer:0 },
  { q:"Threads belonging to the same process share the same virtual memory space.", options:TF, answer:0 },
  { q:"In a snooping protocol, a centralized directory stores all sharing information.", options:TF, answer:1 },
  { q:"The operating system component responsible for selecting threads for execution is the ____.", hint:"1 слово", accept:["scheduler"] },
  { q:"In a directory-based protocol, sharing information is maintained in a ____.", hint:"1 слово", accept:["directory"] },
  { q:"A multiprocessor architecture in which memory is distributed among processors but presented as shared memory is called ____.", hint:"3 слова", accept:["distributed shared memory","dsm"] },
];

const TOTAL_MINUTES = 40;          // время на тест
const STORAGE_KEY = "quiz_state_v3";

/* ========================================================= */
const $ = id => document.getElementById(id);
let state = {
  current:0,
  answers:Array(QUESTIONS.length).fill(null),
  endsAt:Date.now() + TOTAL_MINUTES*60*1000,
  finished:false
};
try{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if(saved && saved.answers && saved.answers.length === QUESTIONS.length) state = saved;
}catch(e){}
const save = () => { try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} };

const N = QUESTIONS.length;
const norm = x => String(x||"").toLowerCase().replace(/[-_.,]/g," ").replace(/\s+/g," ").trim();
const isFill = q => !!q.accept;
const isRight = (q,a) => isFill(q) ? q.accept.some(x=>norm(x)===norm(a)) : a===q.answer;
const rightText = q => isFill(q) ? q.accept[0] : q.options[q.answer];
const yourText = (q,a) => a===null ? "нет ответа" : (isFill(q) ? a : q.options[a]);

function render(){
  if(state.finished){ renderResults(); return; }
  const i = state.current, item = QUESTIONS[i];
  $("counter").textContent = `${i+1} / ${N}`;
  $("qLabel").textContent = `Вопрос ${i+1} из ${N}`;
  $("qText").textContent = item.q;
  $("progressBar").style.width = `${((i+1)/N)*100}%`;

  const box = $("options"); box.innerHTML = "";
  if(isFill(item)){
    const inp = document.createElement("input");
    inp.className = "fill-input"; inp.placeholder = item.hint || "Ответ";
    inp.autocomplete = "off"; inp.autocapitalize = "off"; inp.spellcheck = false;
    inp.value = state.answers[i] || "";
    inp.oninput = () => { state.answers[i] = inp.value.trim() ? inp.value : null; save(); };
    box.appendChild(inp);
  } else
  item.options.forEach((text, k) => {
    const b = document.createElement("button");
    b.className = "option" + (state.answers[i] === k ? " selected" : "");
    b.innerHTML = `<span class="radio"></span><span></span>`;
    b.lastChild.textContent = text;
    b.onclick = () => { state.answers[i] = k; save(); render(); };
    box.appendChild(b);
  });

  $("prevBtn").disabled = i === 0;
  $("nextBtn").textContent = i === N-1 ? "Завершить" : "Далее";
  $("content").scrollTop = 0;
}

function go(i){ state.current = Math.max(0, Math.min(N-1, i)); save(); render(); }

$("prevBtn").onclick = () => { if(state.finished) return; go(state.current-1); };
$("nextBtn").onclick = () => {
  if(state.finished){ restart(); return; }
  if(state.current < N-1) go(state.current+1);
  else openModal();
};

/* ----- Timer ----- */
function tick(){
  if(state.finished) return;
  let left = Math.max(0, state.endsAt - Date.now());
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  $("timer").textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  $("timerPill").classList.toggle("warn", left < 60000);
  if(left <= 0) finish();
}
setInterval(tick, 500); tick();

/* ----- Grid sheet ----- */
function openSheet(){
  if(state.finished) return;
  const g = $("grid"); g.innerHTML = "";
  QUESTIONS.forEach((_, k) => {
    const b = document.createElement("button");
    b.textContent = k+1;
    if(state.answers[k] !== null) b.classList.add("answered");
    if(k === state.current) b.classList.add("current");
    b.onclick = () => { closeAll(); go(k); };
    g.appendChild(b);
  });
  $("sheetInfo").textContent = `Отвечено ${state.answers.filter(a=>a!==null).length} из ${N}`;
  $("overlay").classList.add("open"); $("sheet").classList.add("open");
}
function closeAll(){
  ["overlay","sheet","modal"].forEach(id => $(id).classList.remove("open"));
}
$("gridBtn").onclick = openSheet;
$("overlay").onclick = closeAll;

/* ----- Modal ----- */
function openModal(){
  const left = state.answers.filter(a=>a===null).length;
  $("modalText").textContent = left
    ? `Без ответа осталось вопросов: ${left}. Всё равно завершить?`
    : "Ответы будут проверены, изменить их уже не получится.";
  $("overlay").classList.add("open"); $("modal").classList.add("open");
}
$("closeBtn").onclick = () => state.finished ? restart() : openModal();
$("modalCancel").onclick = closeAll;
$("modalOk").onclick = () => { closeAll(); finish(); };

/* ----- Finish & results ----- */
function finish(){ state.finished = true; save(); render(); }

function renderResults(){
  $("quizView").classList.add("hidden");
  const rv = $("resultView"); rv.classList.remove("hidden");
  const correct = QUESTIONS.filter((q,i)=>isRight(q,state.answers[i])).length;
  const skipped = state.answers.filter(a=>a===null).length;
  const pct = Math.round(correct/N*100);

  $("counter").textContent = `${N} / ${N}`;
  $("progressBar").style.width = "100%";
  $("timer").textContent = "00:00";
  $("prevBtn").classList.add("hidden");
  $("footer").style.justifyContent = "center";
  $("nextBtn").textContent = "Пройти заново";
  $("nextBtn").style.width = "100%";

  const color = pct >= 70 ? "var(--ok)" : pct >= 40 ? "#F5A524" : "var(--bad)";
  let html = `
    <div class="result-head">
      <div class="score-ring" style="background:conic-gradient(${color} ${pct*3.6}deg,#E3E6EC 0)">
        <div><b>${pct}%</b><span>результат</span></div>
      </div>
      <h2>${pct>=70?"Отлично!":pct>=40?"Неплохо":"Нужно повторить"}</h2>
      <p>Правильных ответов: ${correct} из ${N}</p>
    </div>
    <div class="stats">
      <div class="stat"><b style="color:var(--ok)">${correct}</b><span>верно</span></div>
      <div class="stat"><b style="color:var(--bad)">${N-correct-skipped}</b><span>ошибки</span></div>
      <div class="stat"><b>${skipped}</b><span>пропущено</span></div>
    </div>`;
  QUESTIONS.forEach((q,i)=>{
    const a = state.answers[i], ok = isRight(q,a);
    html += `<div class="review-item ${ok?"ok":""}">
      <div class="n">Вопрос ${i+1}</div>
      <div class="qq"></div>
      ${ok ? "" : `<div class="a your"></div>`}
      <div class="a right"></div>
    </div>`;
  });
  rv.innerHTML = html;
  // безопасная вставка текста
  rv.querySelectorAll(".review-item").forEach((el,i)=>{
    const q = QUESTIONS[i], a = state.answers[i];
    el.querySelector(".qq").textContent = q.q;
    const your = el.querySelector(".your");
    if(your) your.textContent = "✗ Ваш ответ: " + yourText(q,a);
    el.querySelector(".right").textContent = "✓ " + rightText(q);
  });
  $("content").scrollTop = 0;
}

function restart(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  location.reload();
}

render();
</script>
</body>
</html>
